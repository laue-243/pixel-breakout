<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Breakout — Improved</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 6px solid #333; image-rendering: pixelated; box-shadow: 0 0 30px #f0f8; }
</style>
</head>
<body>
<canvas id="game" width="560" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let paddleX = 230, paddleW = 90;
let ball = {x:280, y:300, vx:4, vy:-4};
let bricks = [];
let score = 0, best = parseInt(localStorage.getItem('breakBest')||'0');
let state = 'start';
let particles = [];

function createBricks() {
  bricks = [];
  const rows = 6, cols = 9;
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      bricks.push({
        x: c*60 + 20, y: r*22 + 40,
        w:54, h:18,
        alive: true,
        color: `hsl(${r*50}, 80%, 55%)`
      });
    }
  }
}

function addParticles(x,y,color) {
  for (let i=0; i<10; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-0.5)*6,
      life: 25,
      color
    });
  }
}

function draw() {
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0,0,560,400);

  // Bricks
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(b.x, b.y, b.w, 4);
  });

  // Paddle
  ctx.fillStyle = '#0f0';
  ctx.fillRect(paddleX, 360, paddleW, 12);
  ctx.fillStyle = '#4f4';
  ctx.fillRect(paddleX+10, 360, paddleW-20, 4);

  // Ball
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Particles
  particles.forEach((p,i) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = p.life/25;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
    if (p.life <= 0) particles.splice(i,1);
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('Score: '+score+'  Best: '+best, 10, 25);

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0,0,560,400);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BREAKOUT', 280, 160);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Move mouse to control paddle', 280, 210);
    ctx.fillText('Click or SPACE to start', 280, 250);
  }
  if (state === 'over' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,560,400);
    ctx.fillStyle = state === 'win' ? '#0f0' : '#f44';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'win' ? 'YOU WIN!' : 'GAME OVER', 280, 160);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: '+score, 280, 210);
    ctx.fillText('SPACE to restart', 280, 260);
  }
}

function update() {
  if (state !== 'play') return;
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x < 6 || ball.x > 554) ball.vx *= -1;
  if (ball.y < 6) ball.vy *= -1;
  if (ball.y > 390) { state = 'over'; return; }

  if (ball.y > 350 && ball.y < 372 && ball.x > paddleX && ball.x < paddleX + paddleW) {
    ball.vy = -Math.abs(ball.vy);
    ball.vx = (ball.x - (paddleX + paddleW/2)) * 0.15;
  }

  bricks.forEach(b => {
    if (!b.alive) return;
    if (ball.x > b.x && ball.x < b.x+b.w && ball.y > b.y && ball.y < b.y+b.h) {
      b.alive = false;
      ball.vy *= -1;
      score += 10;
      addParticles(b.x+b.w/2, b.y+b.h/2, b.color);
      if (score > best) { best = score; localStorage.setItem('breakBest', best); }
    }
  });

  if (bricks.every(b => !b.alive)) state = 'win';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  paddleX = e.clientX - rect.left - paddleW/2;
  paddleX = Math.max(0, Math.min(470, paddleX));
});

document.addEventListener('keydown', e => {
  if ((state === 'start' || state === 'over' || state === 'win') && e.code === 'Space') {
    createBricks();
    ball = {x:280, y:300, vx:4, vy:-4};
    score = 0;
    state = 'play';
  }
});
canvas.addEventListener('click', () => {
  if (state === 'start') {
    createBricks();
    state = 'play';
  }
});

createBricks();
loop();
</script>
</body>
</html>
